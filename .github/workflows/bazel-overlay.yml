name: Bazel overlay

on:
  push:
    branches:
      - master
      - "cerisier/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.os }} / Bazel ${{ matrix.bazel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
        bazel:
          - 8.4.2
          - 9.2.0
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Check out the Bazel branch and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Verify release provenance and overlay synchronization
        run: ./tools/bcr/verify_release.sh 0.16.6

      - name: Build the minimal static and shared public graph
        run: |
          bazel build \
            --//config:backend=none \
            --//config:transport=none \
            --//config:screenshot=none \
            //:sentry \
            //:sentry_shared \
            //:sentry_shared_library \
            //tests/bazel:smoke \
            //tests/bazel:shared_smoke

      - name: Run static and shared consumers
        run: |
          bazel run \
            --//config:backend=none \
            --//config:transport=none \
            --//config:screenshot=none \
            //tests/bazel:smoke
          bazel run \
            --//config:backend=none \
            --//config:transport=none \
            --//config:screenshot=none \
            //tests/bazel:shared_smoke

  backend-artifacts:
    name: Linux backend artifact tests
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: 9.2.0
    steps:
      - name: Check out the Bazel branch and submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Test Breakpad artifacts
        run: |
          bazel test \
            --//config:backend=breakpad \
            --//config:transport=none \
            --//config:screenshot=none \
            //tests/breakpad:crash_artifact_test \
            //tests/breakpad:shared_crash_artifact_test

      - name: Test Crashpad artifacts
        run: |
          bazel test \
            --//config:backend=crashpad \
            --//config:transport=none \
            --//config:screenshot=none \
            //tests/crashpad:crash_artifact_test \
            //tests/crashpad:shared_crash_artifact_test \
            //tests/crashpad:invalid_handler_test

      - name: Test native-backend artifacts
        run: |
          bazel test \
            --//config:backend=native \
            --//config:transport=none \
            --//config:screenshot=none \
            //tests/native:crash_artifact_test \
            //tests/native:shared_crash_artifact_test
